<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epsilon</title>
  <link rel="stylesheet" href="./scr/styles.css" />
  <script src="./lib/p5.min.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <strong>Epsilon</strong>
      <nav>
        <button id="btn-new">New</button>
        <button id="btn-open">Open</button>
        <button id="btn-save">Save</button>
        <span class="sep"></span>
        <button id="btn-undo" title="Ctrl+Z">Undo</button>
        <button id="btn-redo" title="Ctrl+Y">Redo</button>
        <span class="sep"></span>
        <button id="btn-export-h" title="C header for the firmware">Export .h</button>
        <button id="btn-export-bin">Export .bin</button>
      </nav>
      <button id="btn-play" title="Space">Pause</button>
      <span id="clock">0.00 s</span>
      <span id="status" role="status"></span>
      <input id="file-open" type="file" accept=".json" hidden />
    </header>

    <aside class="assets panel">
      <h3>Tools</h3>
      <div id="tools" class="tools"></div>
      <label class="check"><input id="onion" type="checkbox" /> Onion skin</label>
      <h3>Objects</h3>
      <div id="objects"></div>
    </aside>

    <main class="editor">
      <div id="editor"></div>
    </main>

    <aside class="inspector panel" id="inspector"></aside>

    <aside class="emulator">
      <div id="emulator"></div>
    </aside>

    <aside class="curves">
      <div id="curves"></div>
      <div id="curve-presets"></div>
    </aside>

    <div class="timeline">
      <div id="zoombar"></div>
      <div id="framebar"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
