
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epsilon</title>
  <link rel="stylesheet" href="./scr/styles.css" />
  <script src="./lib/p5.min.js"></script>
</head>
<body>
  <div class="editor">
    <header class="topbar">
      <strong>Epsilon</strong>
      <nav>
        <button>Project</button>
        <button>Edit</button>
        <button>View</button>
        <button>Export</button>
      </nav>
    </header>

    <aside class="assets panel">
      <h3>Objects</h3>
      <button data-sketch="sketchA">Sketch A</button>
      <button data-sketch="sketchB">Sketch B</button>
    </aside>

    <main class="workspace">
      <div class="canvas-header">Preview</div>
      <div id="preview"></div>
    </main>

    <aside class="emulator">
        <div id="emulator"></div>
    </aside>

    <aside class="curves">
        <div id="curves"></div>
    </aside>

    <aside class="inspector panel">
      <h3>Inspector</h3>
      <p>Select an object to edit its properties.</p>
    </aside>

    <section class="timeline panel">
      <h3>Timeline / Layers</h3>
      <div>Layer 1</div>
      <div>Layer 2</div>
    </section>
  </div>


  <script type="module" src="main.js"></script>
</body>
</html>
